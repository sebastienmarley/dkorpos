{{ define "main" }}
<div class="wrap narrow">
  <nav class="crumbs" aria-label="Fil d'Ariane"><a href="{{ "/" | relURL }}">Accueil</a></nav>
  <header class="page-head"><h1>{{ if eq .Data.Plural "tags" }}Étiquettes{{ else }}Catégories{{ end }}</h1></header>
  <ul class="tag-cloud">
    {{- range .Data.Terms.Alphabetical }}
    <li><a href="{{ .Page.RelPermalink }}">#{{ .Page.LinkTitle }} <span class="muted">{{ .Count }}</span></a></li>
    {{- end }}
  </ul>
</div>
{{ end }}
