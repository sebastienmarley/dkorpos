name: Laravel CI

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'dkor/**'
      - '.github/workflows/laravel-ci.yml'
  pull_request:
    paths:
      - 'dkor/**'
      - '.github/workflows/laravel-ci.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dkor

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, sqlite3, bcmath, gd, xml, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dkor/package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run project validation
        run: composer test

  tests-pgsql:
    # La production roule sur PostgreSQL (ADR 0014) : la suite y roule aussi, pour attraper ce que SQLite tolère.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dkor

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dkor_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: dkor_testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql, bcmath, gd, xml, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dkor/package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --class=ReferenceDataSeeder --force

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run tests on PostgreSQL
        run: php artisan test --compact --parallel --processes=4

  deploy:
    # Le déploiement automatique de Laravel Cloud est désactivé (ADR 0014) : seule cette tâche déploie, et seulement
    # quand les deux suites passent. develop → préproduction, main → production.
    needs: [tests, tests-pgsql]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Trigger Laravel Cloud deployment
        env:
          BRANCH: ${{ github.ref_name }}
          PRODUCTION_DEPLOY_HOOK: ${{ secrets.LARAVEL_CLOUD_PRODUCTION_DEPLOY_HOOK }}
          STAGING_DEPLOY_HOOK: ${{ secrets.LARAVEL_CLOUD_STAGING_DEPLOY_HOOK }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            hook="$PRODUCTION_DEPLOY_HOOK"
            if [ -z "$hook" ]; then
              echo "::error::Le secret LARAVEL_CLOUD_PRODUCTION_DEPLOY_HOOK est vide : la production n'est pas déployée."
              exit 1
            fi
          else
            hook="$STAGING_DEPLOY_HOOK"
            if [ -z "$hook" ]; then
              echo "::warning::Le secret LARAVEL_CLOUD_STAGING_DEPLOY_HOOK est vide : aucune préproduction n'est déployée."
              exit 0
            fi
          fi

          curl --fail --silent --show-error --request POST "$hook"
          echo "Déploiement de $BRANCH demandé à Laravel Cloud (commit $GITHUB_SHA)."
